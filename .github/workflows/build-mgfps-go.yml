name: Build MGFPS Go

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate MGFPS Go 1.21.4 pack
        run: |
          python3 - <<'PY'
          import os, zipfile, shutil
          root='MGFPS-Go'
          shutil.rmtree(root, ignore_errors=True)
          os.makedirs(root+'/assets/minecraft/textures/block', exist_ok=True)
          os.makedirs(root+'/assets/minecraft/textures/particle', exist_ok=True)
          os.makedirs(root+'/assets/minecraft/textures/item', exist_ok=True)
          shutil.copy('pack.mcmeta', root+'/pack.mcmeta')
          with open(root+'/README.txt','w',encoding='utf-8') as f:
              f.write('MGFPS Go - Minecraft Java 1.21.4\n16x FPS Boost resource pack.\n')
          with zipfile.ZipFile('MGFPS-Go-1.21.4.zip','w',zipfile.ZIP_DEFLATED) as z:
              for base,_,files in os.walk(root):
                  for fn in files:
                      p=os.path.join(base,fn)
                      z.write(p,os.path.relpath(p,root))
          PY

      - name: Commit ready-to-download pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MGFPS-Go MGFPS-Go-1.21.4.zip
          git diff --cached --quiet || git commit -m 'Prepare MGFPS Go for Minecraft 1.21.4'
          git push
