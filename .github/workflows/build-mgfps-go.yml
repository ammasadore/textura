name: Build MGFPS Go

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate MGFPS Go textures
        run: |
          python3 <<'PY'
          import os, struct, zlib, zipfile, shutil

          root='MGFPS-Go'
          shutil.rmtree(root, ignore_errors=True)
          os.makedirs(root+'/assets/minecraft/textures/block', exist_ok=True)
          os.makedirs(root+'/assets/minecraft/textures/particle', exist_ok=True)

          def png(path, color, accent=None, alpha=255):
              w=h=16
              rows=[]
              for y in range(h):
                  row=bytearray([0])
                  for x in range(w):
                      c=color
                      if accent and ((x+y)%4==0 or x in (0,15) or y in (0,15)):
                          c=accent
                      row.extend((*c, alpha))
                  rows.append(bytes(row))
              raw=b''.join(rows)
              def chunk(t,d):
                  return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
              with open(path,'wb') as f: f.write(data)

          blocks={
            'stone':((125,125,125),(105,105,105)),'cobblestone':((110,110,110),(90,90,90)),
            'dirt':((125,88,55),(105,70,42)),'grass_block_top':((95,150,65),(75,125,50)),
            'grass_block_side':((110,80,50),(80,125,55)),'sand':((220,205,145),(200,185,125)),
            'gravel':((140,135,130),(115,110,105)),'deepslate':((70,72,78),(55,57,62)),
            'bedrock':((55,55,55),(40,40,40)),'netherrack':((125,55,50),(100,40,38)),
            'soul_sand':((85,65,55),(65,48,42)),'soul_soil':((70,60,55),(50,42,38)),
            'end_stone':((215,210,150),(190,185,125)),'obsidian':((30,22,42),(45,30,55)),
            'oak_planks':((170,125,70),(145,100,50)),'spruce_planks':((105,75,45),(85,58,35)),
            'birch_planks':((205,190,150),(180,165,125)),'jungle_planks':((165,115,65),(140,90,45)),
            'acacia_planks':((175,90,45),(145,65,35)),'dark_oak_planks':((75,52,32),(55,38,24)),
            'mangrove_planks':((115,55,55),(90,40,45)),'cherry_planks':((225,145,155),(200,115,135)),
            'glass':((190,225,235),(220,245,250),128),'ice':((155,205,235),(190,230,250),190),
            'snow':((240,245,250),(220,230,240)),'clay':((155,165,175),(130,140,150)),
            'terracotta':((150,85,65),(125,65,50)),'bricks':((155,70,60),(125,50,45)),
            'iron_block':((205,205,200),(175,175,170)),'gold_block':((240,195,45),(215,165,30)),
            'diamond_block':((55,215,205),(35,175,170)),'emerald_block':((35,190,100),(25,155,75)),
            'redstone_block':((190,30,25),(145,20,18)),'lapis_block':((35,75,170),(25,55,135)),
            'coal_block':((35,35,35),(20,20,20)),'quartz_block':((225,220,210),(200,195,185)),
            'netherite_block':((55,52,55),(40,38,42)),'copper_block':((185,105,70),(150,80,55)),
            'water_still':((45,125,205),(30,105,180)),'lava_still':((245,80,15),(255,150,20))
          }
          for name,v in blocks.items():
              color=v[0]; accent=v[1]; alpha=v[2] if len(v)>2 else 255
              png(f'{root}/assets/minecraft/textures/block/{name}.png',color,accent,alpha)

          # Static fire: replace animated fire frames with transparent textures.
          particle_dir=root+'/assets/minecraft/textures/particle'
          for name in ['smoke','ash','campfire_cosy_smoke','campfire_signal_smoke','cloud','rain','splash','effect','damage_indicator','critical','enchanted_hit','sweep_attack','heart','angry_villager','happy_villager','note','bubble','bubble_pop','nautilus','poof']:
              png(f'{particle_dir}/{name}.png',(0,0,0),None,0)
          for i in range(32):
              png(f'{particle_dir}/flame_{i}.png',(0,0,0),None,0)
          for i in range(16):
              png(f'{particle_dir}/soul_fire_flame_{i}.png',(0,0,0),None,0)
          for i in range(16):
              png(f'{particle_dir}/smoke_{i}.png',(0,0,0),None,0)

          shutil.copy('pack.mcmeta', root+'/pack.mcmeta')
          with open(root+'/MGFPS-Go.txt','w',encoding='utf-8') as f:
              f.write('MGFPS Go - 16x FPS Boost\\nÁgua/lava estáticas e partículas visuais reduzidas.\\n')

          with zipfile.ZipFile('MGFPS-Go.zip','w',zipfile.ZIP_DEFLATED) as z:
              for base,_,files in os.walk(root):
                  for fn in files:
                      p=os.path.join(base,fn)
                      z.write(p,os.path.relpath(p,root))
          PY

      - name: Commit generated pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MGFPS-Go MGFPS-Go.zip
          git diff --cached --quiet || git commit -m 'Build complete MGFPS Go FPS resource pack'
          git push
